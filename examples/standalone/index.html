<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyber UI Toolkit — Gallery</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #e4f5ff;
        background: #050c16;
        font: 14px monospace;
      }
      header {
        padding: 22px 24px 12px;
        border-bottom: 1px solid #26384e;
      }
      h1 {
        margin: 0 0 10px;
        color: #70ccff;
        font-size: 22px;
      }
      p {
        color: #92a8bf;
        line-height: 1.5;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px;
        padding: 18px 24px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input,
      button {
        accent-color: #70ccff;
      }
      button {
        color: #ffd65c;
        background: #0b172c;
        border: 1px solid #70ccff;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #ffd65c;
        outline-offset: 4px;
      }
      canvas {
        display: block;
      }
      footer {
        padding: 12px 24px 24px;
        color: #92a8bf;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Cyber UI Toolkit / Gallery</h1>
      <p>Standalone PixiJS host. No GameDevLand SDK. Resize the window and adjust the controls.</p>
    </header>
    <div class="controls">
      <label>Width <input id="width" type="range" min="180" max="420" value="260" /></label>
      <label>Accent <input id="accent" type="color" value="#70ccff" /></label>
      <label>Speed <input id="speed" type="range" min="0.1" max="3" step="0.1" value="1" /></label>
      <label><input id="active" type="checkbox" checked /> Animate</label>
      <label><input id="reduced" type="checkbox" /> Reduced motion</label>
      <button id="fault" type="button">Signal lost</button>
    </div>
    <main id="canvas" aria-label="Animated cyberpunk component previews"></main>
    <footer>
      Canvas controls demonstrate visual states. Input routing and accessibility belong to the host
      application.
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
